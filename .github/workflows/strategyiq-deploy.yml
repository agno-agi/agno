name: StrategyIQ CI/CD - Vercel + AWS ECS

on:
  push:
    branches: [main]
    paths:
      - "strategyiq-final/**"
  pull_request:
    branches: [main]
    paths:
      - "strategyiq-final/**"

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: strategyiq-api
  ECS_CLUSTER: strategyiq
  ECS_SERVICE: api
  CONTAINER_NAME: api

defaults:
  run:
    working-directory: strategyiq-final

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint Python
        run: |
          cd backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-for-ci-only-not-production
        run: |
          cd backend
          pytest -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        env:
          JWT_SECRET: test-secret-for-ci-only-not-production
        run: |
          cd frontend
          npm install
          npm run build

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Missing VERCEL_TOKEN/ORG_ID/PROJECT_ID must not fail the whole workflow.
    continue-on-error: true
    defaults:
      run:
        working-directory: strategyiq-final
    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not configured; skipping frontend deploy"
            exit 1
          fi

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          working-directory: strategyiq-final/frontend
          vercel-args: "--prod"

  deploy-backend:
    name: Deploy Backend to AWS ECS
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Missing AWS OIDC role must not fail the whole workflow.
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: strategyiq-final
    steps:
      - uses: actions/checkout@v4

      - name: Require AWS role secret
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -z "$AWS_ROLE_TO_ASSUME" ]; then
            echo "AWS_ROLE_TO_ASSUME not configured; skipping backend deploy"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f infra/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition strategyiq-api --query taskDefinition > task-definition.json

      - name: Fill in new image ID in task def
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Run DB migrations (Alembic)
        run: |
          aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition strategyiq-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.SUBNET_IDS }}],securityGroups=[${{ secrets.SG_ID }}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"migrate","command":["alembic","upgrade","head"]}]}'

  notify:
    needs: [deploy-frontend, deploy-backend]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Do not inherit repo defaults.working-directory — this job has no checkout.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Notify Slack/Discord
        run: |
          echo "Deploy finished: Frontend ${{ needs.deploy-frontend.result }}, Backend ${{ needs.deploy-backend.result }}"
