name: Validation

on:
  push:
    branches:
      - "main"
      - "v2.6.0"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - "main"
      - "v2.6.0"
      - "feat/v2.7" # Sub-PRs into the release branch get the same gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-check-agno:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    defaults:
      run:
        working-directory: libs/agno

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          # Install the workspace agnoctl alongside agno so a just-bumped,
          # not-yet-published agnoctl version cannot break the resolve.
          python -m pip install -e ../agnoctl -e .[dev]
      - name: Ruff check
        run: |
          ruff check .
      - name: Mypy
        run: |
          mypy . --config-file pyproject.toml

  style-check-agnoctl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    defaults:
      run:
        working-directory: libs/agnoctl

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install -e .[dev]
      - name: Ruff check
        run: |
          ruff check .
      - name: Mypy
        run: |
          mypy . --config-file pyproject.toml
      - name: Run agnoctl tests
        run: |
          python -m pytest ./tests

  style-check-cookbook:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    defaults:
      run:
        working-directory: cookbook

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install -e ../libs/agnoctl -e "../libs/agno/"[dev]
      - name: Ruff check
        run: |
          ruff check .
      # - name: Mypy
      #   run: |
      #     mypy .


  style-check-agno-infra:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    defaults:
      run:
        working-directory: libs/agno_infra

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install -e .[dev]
      - name: Ruff check
        run: |
          ruff check .
      - name: Mypy
        run: |
          mypy . --config-file pyproject.toml

  tests:
    runs-on: ubuntu-latest
    # Skip push events if there's an open PR from the same branch
    if: github.event_name != 'push' || !github.event.pull_request
    strategy:
      matrix:
        include:
          - shard: 1
            name: "tools-agent"
            python-version: "3.12"
            paths: "libs/agno/tests/unit/tools libs/agno/tests/unit/agent libs/agno/tests/unit/context libs/agno/tests/unit/run libs/agno/tests/unit/memory"
          - shard: 2
            name: "os-models-team"
            python-version: "3.12"
            paths: "libs/agno/tests/unit/os libs/agno/tests/unit/models libs/agno/tests/unit/team libs/agno/tests/unit/knowledge libs/agno/tests/unit/reader libs/agno/tests/unit/skills libs/agno/tests/unit/eval"
          - shard: 3
            name: "infra-utils"
            python-version: "3.12"
            # Catch-all: runs all unit tests except shard 1+2 directories
            paths: "libs/agno/tests/unit"
            extra_ignores: "--ignore=libs/agno/tests/unit/tools --ignore=libs/agno/tests/unit/agent --ignore=libs/agno/tests/unit/context --ignore=libs/agno/tests/unit/run --ignore=libs/agno/tests/unit/memory --ignore=libs/agno/tests/unit/os --ignore=libs/agno/tests/unit/models --ignore=libs/agno/tests/unit/team --ignore=libs/agno/tests/unit/knowledge --ignore=libs/agno/tests/unit/reader --ignore=libs/agno/tests/unit/skills --ignore=libs/agno/tests/unit/eval"
      fail-fast: true # Stop all matrix jobs if one fails

    name: tests (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "libs/agno/pyproject.toml"
      - name: Run test setup
        working-directory: .
        run: |
          set -e
          ./scripts/test_setup.sh
      - name: Run tests (shard ${{ matrix.shard }})
        working-directory: .
        env:
          AGNO_TELEMETRY: false
          COVERAGE_FILE: .coverage.${{ matrix.name }}
        run: |
          source .venv/bin/activate
          uv pip install pytest-xdist --quiet
          python -m pytest -n auto --dist loadgroup --cov=agno ${{ matrix.paths }} ${{ matrix.extra_ignores }} --ignore=libs/agno/tests/unit/models/litellm --ignore=libs/agno/tests/unit/tools/test_crawl4ai.py --ignore=libs/agno/tests/unit/tools/test_scrapegraph.py
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: .coverage.${{ matrix.name }}
          retention-days: 1
          include-hidden-files: true

  coverage-report:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name != 'push' || !github.event.pull_request
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage reports
        run: |
          pip install coverage
          coverage combine
          coverage json -o coverage-agno.json
          AGNO_COVERAGE=$(python -c 'import json; print(json.load(open("coverage-agno.json"))["totals"]["percent_covered_display"])')
          echo "AGNO_COVERAGE=$AGNO_COVERAGE" >> $GITHUB_ENV
          echo "Combined coverage: $AGNO_COVERAGE"
