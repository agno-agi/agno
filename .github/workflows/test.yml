name: Validation

on:
  push:
    branches:
      - "main"
      - "v2.6.0"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - "main"
      - "v2.6.0"
      - "feat/v2.7" # Sub-PRs into the release branch get the same gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-check-agno:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    defaults:
      run:
        working-directory: libs/agno

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          # Install the workspace agnoctl alongside agno so a just-bumped,
          # not-yet-published agnoctl version cannot break the resolve.
          python -m pip install -e ../agnoctl -e .[dev]
      - name: Ruff check
        run: |
          ruff check .
      - name: Mypy
        run: |
          mypy . --config-file pyproject.toml

  style-check-agnoctl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    defaults:
      run:
        working-directory: libs/agnoctl

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install -e .[dev]
      - name: Ruff check
        run: |
          ruff check .
      - name: Mypy
        run: |
          mypy . --config-file pyproject.toml
      - name: Run agnoctl tests
        run: |
          python -m pytest ./tests

  style-check-cookbook:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    defaults:
      run:
        working-directory: cookbook

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install -e ../libs/agnoctl -e "../libs/agno/"[dev]
      - name: Ruff check
        run: |
          ruff check .
      # - name: Mypy
      #   run: |
      #     mypy .


  style-check-agno-infra:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    defaults:
      run:
        working-directory: libs/agno_infra

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install -e .[dev]
      - name: Ruff check
        run: |
          ruff check .
      - name: Mypy
        run: |
          mypy . --config-file pyproject.toml

  tests:
    runs-on: ubuntu-latest
    # Skip push events if there's an open PR from the same branch
    if: github.event_name != 'push' || !github.event.pull_request
    strategy:
      matrix:
        include:
          - shard: 1
            name: "tools-agent"
            paths: "libs/agno/tests/unit/tools libs/agno/tests/unit/agent libs/agno/tests/unit/context libs/agno/tests/unit/run libs/agno/tests/unit/memory"
          - shard: 2
            name: "os-models-team"
            paths: "libs/agno/tests/unit/os libs/agno/tests/unit/models libs/agno/tests/unit/team libs/agno/tests/unit/knowledge libs/agno/tests/unit/reader libs/agno/tests/unit/skills libs/agno/tests/unit/eval"
          - shard: 3
            name: "infra-utils"
            paths: "libs/agno/tests/unit/vectordb libs/agno/tests/unit/utils libs/agno/tests/unit/workflow libs/agno/tests/unit/db libs/agno/tests/unit/scheduler libs/agno/tests/unit/registry libs/agno/tests/unit/reasoning libs/agno/tests/unit/telemetry libs/agno/tests/unit/learn libs/agno/tests/unit/integrations libs/agno/tests/unit/app libs/agno/tests/unit/remote libs/agno/tests/unit/guardrails libs/agno/tests/unit/compression libs/agno/tests/unit/agents libs/agno/tests/unit/a2a libs/agno/tests/unit/test_*.py"
      fail-fast: true # Stop all matrix jobs if one fails

    name: tests (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          set -e
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Run test setup
        working-directory: .
        run: |
          set -e
          ./scripts/test_setup.sh
      - name: Run tests (shard ${{ matrix.shard }})
        working-directory: .
        env:
          AGNO_TELEMETRY: false
        run: |
          source .venv/bin/activate
          python -m pytest ${{ matrix.paths }} --ignore=libs/agno/tests/unit/models/litellm --ignore=libs/agno/tests/unit/tools/test_crawl4ai.py --ignore=libs/agno/tests/unit/tools/test_scrapegraph.py
