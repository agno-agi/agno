# Round-robin (NON-sticky on purpose) LB across the two replicas.
# Non-sticky routing is what exercises cross-replica resume/tail.
events {}
http {
    upstream agentos {
        server replica1:7777;
        server replica2:7777;
    }
    # Set Connection: "upgrade" for WebSocket handshakes, "" (keep-alive) otherwise.
    # Hardcoding Connection "" (SSE) would break the WS upgrade; this map serves both.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Long timeouts so SSE/WS streams aren't cut by the proxy.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    server {
        listen 7777;
        location / {
            proxy_pass http://agentos;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;         # required for SSE
        }
    }
}
